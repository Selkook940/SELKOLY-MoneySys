<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============ SAĞ ÜST HUD ============ -->
    <div id="money-hud">
        <!-- BANKA -->
        <div class="hud-card bank-card" id="bank-card">
            <div class="card-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 21H21M3 18H21M5 18V10M8 18V10M12 18V10M16 18V10M19 18V10M12 3L21 8H3L12 3Z"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="card-body">
                <div class="card-label">BANKA</div>
                <div class="card-value" id="bank-value">$0</div>
            </div>
        </div>

        <!-- NAKİT -->
        <div class="hud-card cash-card" id="cash-card">
            <div class="card-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 1V23M17 5H9.5C8.57 5 7.68 5.37 7.02 6.02C6.37 6.68 6 7.57 6 8.5C6 9.43 6.37 10.32 7.02 10.98C7.68 11.63 8.57 12 9.5 12H14.5C15.43 12 16.32 12.37 16.98 13.02C17.63 13.68 18 14.57 18 15.5C18 16.43 17.63 17.32 16.98 17.98C16.32 18.63 15.43 19 14.5 19H6"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="card-body">
                <div class="card-label">NAKİT</div>
                <div class="card-value" id="cash-value">$0</div>
            </div>
        </div>
    </div>

    <!-- ============ ALT BİLDİRİM ============ -->
    <div id="notif-wrapper">
        <div id="notif-box">
            <div id="notif-glow"></div>
            <div id="notif-inner">
                <span id="notif-icon-wrap">
                    <span id="notif-dir"></span>
                </span>
                <div id="notif-text">
                    <div id="notif-amount">$0</div>
                    <div id="notif-label">Nakit</div>
                </div>
            </div>
            <div id="notif-progress"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
